<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Yoshe con Hoyo: la crónica de un grupo de amigos, temporada por temporada.">
<meta name="theme-color" content="#011223">
<title>Yoshe con Hoyo — La Crónica</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='38%25' cy='34%25' r='70%25'%3E%3Cstop offset='0' stop-color='%23ffffff'/%3E%3Cstop offset='.45' stop-color='%2368d8ff'/%3E%3Cstop offset='1' stop-color='%23123a6b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="skyPhoto"></div>
<div id="skyWash"></div>
<canvas id="stars"></canvas>
<div id="grain"></div>

<header class="topnav">
  <div class="brand" onclick="location.hash='#/home'">
    <div class="mark"></div>
    <div class="name">Yoshe con <em>Hoyo</em></div>
  </div>
  <div class="nav-right">
    <nav class="seasons-strip" id="seasonsStrip" aria-label="Secciones y temporadas"></nav>
    <div class="toolbar">
      <button class="tool-btn" title="Buscar" aria-label="Buscar" onclick="toggleSearch()">🔍</button>
      <button class="tool-btn" title="Mapa de relaciones" aria-label="Mapa de relaciones" onclick="location.hash='#/map'">🕸️</button>
      <button class="tool-btn" title="Récords" aria-label="Récords" onclick="location.hash='#/records'">🏆</button>
      <button class="tool-btn" title="El juego: ¿cuánto sabes de la crónica?" aria-label="Juego" onclick="location.hash='#/juego'">🎯</button>
      <button class="tool-btn" title="Historia aleatoria" aria-label="Historia aleatoria" onclick="goRandomStory()">🎲</button>
      <button class="tool-btn" id="editToggleBtn" title="Modo edición" aria-label="Modo edición" onclick="toggleEditMode()">✏️</button>
    </div>
  </div>
</header>

<div id="searchOverlay" class="search-overlay">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Busca un personaje, lugar o palabra dentro de una historia…" oninput="runSearch(this.value)">
    <button class="tool-btn" onclick="toggleSearch()">✕</button>
  </div>
  <div id="searchResults" class="search-results"></div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="edit-bar">
  <span class="edit-tag">✏️<span class="et-long"> Modo edición activo — los cambios se guardan en este navegador</span></span>
  <button onclick="openStoryEditor(currentSeasonId())">➕ Nueva historia</button>
  <button onclick="copyForClaude()">📋 Copiar para Claude</button>
  <button onclick="exportOverrides()">⬇ Exportar cambios</button>
  <button onclick="document.getElementById('importFile').click()">⬆ Importar cambios</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importOverridesFile(this)">
</div>

<div id="app"></div>

<script src="data.js"></script>
<script src="solar.js"></script>
<script src="net3d.js"></script>
<script src="app.js"></script>
</body>
</html>
