<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yoshe con Hoyo — La Crónica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#050914;
  --void-2:#0a1428;
  --void-3:#10203e;
  --hole:#02040a;
  --ink:#eaf2ff;
  --ink-dim:#93aed0;
  --amber:#7fd4ff;
  --amber-dim:#3f9fd6;
  --violet:#5b8fe8;
  --teal:#38d0e0;
  --line: rgba(150,195,255,0.14);
  --card: rgba(110,170,255,0.045);
  --radius: 18px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(ellipse 55% 40% at 84% 4%, rgba(255,190,140,.05), transparent 60%),
    linear-gradient(132deg, transparent 28%, rgba(120,195,255,.09) 44%, rgba(175,230,255,.15) 51%, rgba(120,195,255,.08) 58%, transparent 74%),
    radial-gradient(ellipse 72% 58% at 48% 15%, rgba(130,215,255,.28), transparent 68%),
    radial-gradient(ellipse 92% 62% at 16% 34%, rgba(70,130,225,.22), transparent 72%),
    radial-gradient(ellipse 120% 80% at 68% 94%, rgba(16,34,74,.6), transparent 70%),
    radial-gradient(ellipse 150% 105% at 50% 42%, transparent 38%, rgba(1,3,8,.78) 100%),
    var(--void);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'JetBrains Mono',monospace; letter-spacing:.04em;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--amber); color:var(--hole);}

/* background texture: starfield + grain */
/* absolute (not fixed): the canvas buffer spans the whole document height, so it needs to
   scroll with the page - fixed would freeze it to the first viewport and everything below
   the fold would never be seen */
#stars{position:absolute; top:0; left:0; right:0; z-index:0; pointer-events:none;}
#grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* NAV */
header.topnav{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; gap:12px; flex-wrap:wrap;
  backdrop-filter:blur(10px);
  background:linear-gradient(to bottom, rgba(5,9,20,.92), rgba(5,9,20,.55));
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
.brand .mark{
  width:30px; height:30px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, var(--amber), var(--violet) 70%, transparent 72%);
  box-shadow:0 0 18px 2px rgba(91,143,232,.6);
  flex-shrink:0;
}
.brand .name{font-family:'Fraunces',serif; font-size:1.05rem; font-weight:600; letter-spacing:.01em;}
.brand .name em{font-style:italic; color:var(--amber); font-weight:500;}
nav.seasons-strip{display:flex; gap:6px; align-items:center;}
nav.seasons-strip button{
  font-family:'JetBrains Mono',monospace; font-size:.72rem; padding:7px 11px;
  border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink-dim);
  cursor:pointer; transition:.2s;
}
nav.seasons-strip button:hover{border-color:var(--amber); color:var(--amber);}
nav.seasons-strip button.active{background:var(--amber); color:var(--hole); border-color:var(--amber); font-weight:700;}

/* VIEW SWITCH */
.view{display:none; position:relative; z-index:2;}
.view.active{display:block;}

/* ===== HOME / PORTAL ===== */
.hero{
  min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:60px 20px 20px; position:relative;
}
.hero .eyebrow{font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:.78rem; letter-spacing:.25em; text-transform:uppercase; margin-bottom:18px;}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem); line-height:1.02; margin:0; font-weight:700;}
.hero h1 em{font-style:italic; font-weight:500; color:var(--amber); position:relative;}
.hero p.tag{max-width:560px; color:var(--ink-dim); font-size:1.05rem; margin:22px auto 0; line-height:1.6;}

/* one-shot entrance on first load this session (see viewHome/setupHeroIntro) - a returning
   visit, or a reduced-motion session, never gets the .intro-play class and renders instantly */
.hero.intro-play .eyebrow{animation:heroFadeUp .9s cubic-bezier(.16,1,.3,1) both;}
.hero.intro-play h1{animation:heroTitleIn 1.15s cubic-bezier(.16,1,.3,1) .15s both;}
.hero.intro-play p.tag{animation:heroFadeUp .9s cubic-bezier(.16,1,.3,1) .55s both;}
.hero.intro-play .scroll-cue{animation:heroFadeUp .9s ease .95s both;}
.hero.intro-play .star-node{animation:starIgnite .7s cubic-bezier(.2,1,.3,1) var(--idelay,0s) both;}
@keyframes heroFadeUp{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
@keyframes heroTitleIn{from{opacity:0; transform:translateY(22px) scale(.96); filter:blur(6px);} to{opacity:1; transform:translateY(0) scale(1); filter:blur(0);}}
@keyframes starIgnite{from{opacity:0; transform:translate(-50%,-50%) scale(.2);} to{opacity:1; transform:translate(-50%,-50%) scale(1);}}

.constellation-wrap{position:relative; width:min(920px,92vw); aspect-ratio:16/9; margin:72px auto 10px; isolation:isolate;}
/* outer wrap carries the scroll-recede transform (JS, see setupHeroDepth); the inner tilt
   layer carries the pointer-tilt transform (JS, see setupHeroDepth) - two independent
   inline-style writers on the same element would clobber each other, hence the split */
.constellation-tilt{position:absolute; inset:0; will-change:transform;}
.constellation-wrap::before{
  content:''; position:absolute; inset:-22% -10%; z-index:0; pointer-events:none;
  background:radial-gradient(ellipse 60% 64% at 50% 46%, rgba(120,200,255,.24), rgba(91,143,232,.1) 45%, transparent 72%);
  filter:blur(20px);
}
#constellationSvg{position:absolute; inset:0; width:100%; height:100%; overflow:visible; z-index:1;}
.constellation-line{
  fill:none; stroke-width:1.1; vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 2.5px rgba(120,190,255,.4));
  stroke-linecap:round;
  transition:stroke-width .25s, filter .25s;
}
.constellation-line.line-hot{stroke-width:2.2; filter:drop-shadow(0 0 6px rgba(170,220,255,.95));}
.micro-star{position:absolute; border-radius:50%; background:#eaf2ff; transform:translate(-50%,-50%); animation:microTwinkle 4.5s ease-in-out infinite; pointer-events:none; z-index:1;}
@keyframes microTwinkle{0%,100%{opacity:.15;} 50%{opacity:.85;}}
.star-node{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; cursor:pointer; z-index:2; --pcolor:var(--amber);}
.star-node .star-dot{
  position:relative; width:12px; height:12px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, var(--pcolor) 55%, transparent 78%);
  box-shadow:0 0 8px 2px color-mix(in srgb, var(--pcolor) 65%, transparent), 0 0 20px 7px color-mix(in srgb, var(--pcolor) 30%, transparent);
  transition:transform .3s, box-shadow .3s;
  animation:starBreathe 3.6s ease-in-out infinite;
  animation-delay:var(--bdelay,0s);
}
@keyframes starBreathe{0%,100%{filter:brightness(1);} 50%{filter:brightness(1.35);}}
.star-node:hover .star-dot{transform:scale(1.7); box-shadow:0 0 14px 4px var(--pcolor), 0 0 30px 12px color-mix(in srgb, var(--pcolor) 45%, transparent); animation-play-state:paused;}
/* soft 4-point glint, echoing the lens-flare stars in the reference photos */
.star-node .star-dot::before, .star-node .star-dot::after{
  content:''; position:absolute; left:50%; top:50%; pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--pcolor) 75%, white) 50%, transparent);
  opacity:.5; animation:starBreathe 3.6s ease-in-out infinite; animation-delay:var(--bdelay,0s);
}
.star-node .star-dot::before{width:36px; height:1.4px; transform:translate(-50%,-50%);}
.star-node .star-dot::after{width:1.4px; height:36px; transform:translate(-50%,-50%);}
.star-node.armageddon-node .star-dot::before, .star-node.armageddon-node .star-dot::after{display:none;}
.star-node .star-code{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.72rem; color:var(--ink); margin-top:10px; letter-spacing:.14em;}
.star-node .star-label{font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:.72rem; color:var(--ink-dim); margin-top:3px; max-width:120px; text-align:center; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.star-node.s0 .star-dot{--pcolor:var(--violet);}
.star-node.armageddon-node{opacity:.4; transition:opacity .3s;}
.star-node.armageddon-node .star-dot{width:6px; height:6px; background:rgba(255,255,255,.35); box-shadow:none; animation:none;}
.star-node.armageddon-node .star-code{color:rgba(255,255,255,.4); font-size:.62rem; letter-spacing:.1em;}
.star-node.armageddon-node .star-label{color:rgba(255,255,255,.28); font-size:.58rem; font-style:normal; font-family:'JetBrains Mono',monospace;}
.star-node.armageddon-node:hover{opacity:1;}
@media (max-width:600px){
  .hero{padding:44px 16px 16px; min-height:auto;}
  .constellation-wrap{width:96vw; aspect-ratio:3/4; margin:40px auto 4px;}
  .star-node .star-dot{width:15px; height:15px;}
  .star-node{padding:8px; margin:-8px;} /* larger invisible tap area */
  .star-node .star-code{font-size:.8rem; margin-top:7px;}
  .star-node .star-label{font-size:.68rem; max-width:96px;}
  .star-node.armageddon-node .star-dot{width:8px; height:8px;}
}

/* ===== ARMAGEDDON ===== */
.armageddon-hero{padding:90px 28px 50px; text-align:center; position:relative; overflow:hidden; border-bottom:1px solid rgba(220,50,50,.25); isolation:isolate;}
.armageddon-hero .wash{position:absolute; left:-10%; right:-10%; top:-60px; height:460px; z-index:-1; background:radial-gradient(ellipse 60% 70% at 50% 10%, rgba(180,30,30,.3), transparent 72%); filter:blur(6px);}
.armageddon-hero .eyebrow{font-family:'JetBrains Mono',monospace; color:#ff5252; font-size:.78rem; letter-spacing:.28em; text-transform:uppercase; margin-bottom:16px;}
.armageddon-hero h1{font-family:'Fraunces',serif; font-size:clamp(2.4rem,7vw,4.2rem); letter-spacing:.05em; color:#ffdada; text-shadow:0 0 34px rgba(220,50,50,.5); margin:0;}
.armageddon-hero .prophecy{max-width:640px; margin:22px auto 0; color:var(--ink-dim); line-height:1.75; font-size:1.04rem; font-style:italic;}
.armageddon-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; max-width:1100px; margin:0 auto; padding:0 28px 110px;}
.epitaph-card{border:1px solid rgba(220,50,50,.28); border-radius:14px; padding:20px; background:rgba(180,30,30,.045); transition:.2s; cursor:pointer;}
.epitaph-card:hover{border-color:rgba(220,50,50,.6); background:rgba(180,30,30,.1); transform:translateY(-2px);}
.epitaph-card .ename{font-family:'Fraunces',serif; font-size:1.1rem; font-weight:600; color:#ffb4b4;}
.epitaph-card .edestino{color:var(--ink-dim); font-size:.88rem; margin-top:8px; line-height:1.55; font-style:italic;}
.epitaph-card .edestino.pending{opacity:.5;}

.scroll-cue{margin-top:36px; color:var(--ink-dim); font-size:.8rem; font-family:'JetBrains Mono',monospace; display:flex; flex-direction:column; align-items:center; gap:6px; opacity:.7;}
.scroll-cue .chevron{width:10px;height:10px;border-right:1.5px solid var(--ink-dim); border-bottom:1.5px solid var(--ink-dim); transform:rotate(45deg); animation:bob 1.8s infinite;}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0);}50%{transform:rotate(45deg) translate(4px,4px);}}

/* Below-fold section on home: cast + places grid */
.section-wrap{max-width:1120px; margin:0 auto; padding:100px 28px;}
.section-head{margin-bottom:44px;}
.section-head .eyebrow{font-family:'JetBrains Mono',monospace; color:var(--teal); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;}
.section-head h2{font-size:clamp(1.8rem,4vw,2.6rem); margin:8px 0 0; font-weight:600;}

.grid-cast{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px;}
.cast-card, .place-card{
  border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  background:var(--card); cursor:pointer; transition:.25s;
}
.cast-card:hover, .place-card:hover{border-color:var(--amber); transform:translateY(-3px); background:rgba(127,212,255,.07);}
.cast-avatar{width:52px;height:52px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:1.3rem; margin-bottom:14px; color:var(--hole);}
.cast-card .cname{font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600;}
.cast-card .crole{color:var(--ink-dim); font-size:.82rem; margin-top:3px;}
.tier-badge{display:inline-block; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--line);}
.tier-badge.tier-pri{color:var(--amber); border-color:var(--amber);}
.tier-badge.tier-sec{color:var(--ink-dim);}

.grid-places{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
.place-card .picon{font-size:1.6rem; margin-bottom:10px; display:block;}
.place-card .pname{font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600;}
.place-card .pdesc{color:var(--ink-dim); font-size:.85rem; margin-top:6px; line-height:1.5;}

footer.site-footer{border-top:1px solid var(--line); padding:40px 28px; text-align:center; color:var(--ink-dim); font-size:.8rem;}

/* ===== SEASON VIEW ===== */
.season-hero{
  padding:70px 28px 60px; text-align:center; position:relative; border-bottom:1px solid var(--line);
}
.season-hero .scode-big{font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:.85rem; letter-spacing:.3em;}
.season-hero h1{font-size:clamp(2.2rem,6vw,4rem); margin:14px 0 6px;}
.season-hero .hito{color:var(--ink-dim); max-width:640px; margin:18px auto 0; font-size:1.02rem; line-height:1.6;}
.hito-badge{display:inline-flex; align-items:center; gap:8px; margin-top:22px; padding:8px 16px; border-radius:999px; border:1px solid var(--amber); color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:.72rem;}

.timeline{max-width:920px; margin:0 auto; padding:70px 24px 140px; position:relative;}
.timeline::before{
  content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);
  background:linear-gradient(to bottom, transparent, var(--line) 5%, var(--line) 95%, transparent);
}
.tl-progress{position:absolute; left:50%; top:0; width:2px; transform:translateX(-50%); background:linear-gradient(to bottom, var(--amber), var(--violet)); height:0%; transition:height .1s linear;}

.event{position:relative; width:calc(50% - 46px); margin-bottom:86px; opacity:0; transform:translateY(34px); transition:opacity .7s ease, transform .7s ease;}
.event.visible{opacity:1; transform:translateY(0);}
.event.left{margin-right:auto; text-align:right;}
.event.right{margin-left:auto; text-align:left;}
.event .node-dot{
  position:absolute; top:8px; width:14px; height:14px; border-radius:50%;
  background:var(--void); border:2px solid var(--amber); box-shadow:0 0 0 4px var(--void), 0 0 16px rgba(127,212,255,.5);
}
.event.left .node-dot{right:-53px;}
.event.right .node-dot{left:-53px;}

.event .edate{font-family:'JetBrains Mono',monospace; font-size:.7rem; color:var(--amber); letter-spacing:.12em;}
.event h3{font-size:1.55rem; margin:8px 0 16px; font-weight:600;}
.event.left{align-items:flex-end;}

.polaroid{
  width:100%; max-width:280px; border-radius:6px; padding:10px 10px 34px; background:#f4efe4; color:#231d2e;
  box-shadow:0 14px 30px rgba(0,0,0,.45); transform:rotate(var(--rot,-1.2deg)); margin-bottom:18px; display:inline-block;
}
.event.left .polaroid{margin-left:auto;}
.event.right .polaroid{margin-right:auto;}
.polaroid .frame{
  aspect-ratio:4/3; border-radius:2px; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-size:.62rem; color:rgba(0,0,0,.45); text-align:center; padding:10px;
}
.polaroid .cap{font-family:'JetBrains Mono',monospace; font-size:.62rem; color:rgba(0,0,0,.55); text-align:center; margin-top:8px; letter-spacing:.03em;}

.story-text{color:var(--ink-dim); font-size:1.02rem; line-height:1.75; white-space:pre-wrap;}
.tag-char, .tag-place{
  color:var(--ink); font-weight:600; border-bottom:1.5px dotted var(--amber); cursor:pointer; padding:0 1px; transition:.15s;
}
.tag-char:hover, .tag-place:hover{color:var(--amber); border-bottom-color:var(--amber);}
.tag-place{border-bottom-color:var(--teal);}
.tag-place:hover{color:var(--teal); border-bottom-color:var(--teal);}

.event-tags{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;}
.event.left .event-tags{justify-content:flex-end;}
.chip-small{font-family:'JetBrains Mono',monospace; font-size:.65rem; padding:4px 9px; border-radius:999px; border:1px solid var(--line); color:var(--ink-dim);}

/* ===== PROFILE VIEW (character / place) — "dossier" system ===== */
.profile-hero, .profile-hero-split{
  position:relative; isolation:isolate; overflow:hidden;
  --pcolor: var(--amber);
}
.hero-wash{
  position:absolute; left:-10%; right:-10%; top:-60px; height:460px; z-index:-1;
  background:radial-gradient(ellipse 60% 70% at 50% 10%, color-mix(in srgb, var(--pcolor) 22%, transparent), transparent 72%);
  pointer-events:none;
}
.profile-hero-split .hero-wash{ background:radial-gradient(ellipse 55% 80% at 78% 20%, color-mix(in srgb, var(--pcolor) 20%, transparent), transparent 72%); }

.profile-hero{padding:84px 28px 50px; text-align:center; border-bottom:1px solid var(--line);}
.profile-avatar{
  width:112px;height:112px;border-radius:50%; margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-size:2.6rem; font-weight:700; color:var(--hole);
  border:2px solid color-mix(in srgb, var(--pcolor) 60%, transparent);
  box-shadow:0 0 44px color-mix(in srgb, var(--pcolor) 40%, transparent);
}
.profile-hero h1{font-size:clamp(2rem,5vw,3.2rem); margin:0 0 6px;}
.meta-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:14px;}
.role-chip{
  display:inline-block; font-family:'JetBrains Mono',monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
  padding:6px 13px; border-radius:999px; border:1px solid var(--pcolor); color:var(--pcolor);
}
.profile-bio{
  max-width:640px; margin:26px auto 0; color:var(--ink-dim); line-height:1.75; font-size:1.02rem;
  text-align:left; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--pcolor);
  padding:18px 22px; border-radius:12px;
}
.profile-tags{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:22px;}

.profile-hero-split{
  display:flex; align-items:center; gap:56px; max-width:1080px; margin:0 auto; text-align:left;
  flex-wrap:wrap; padding:84px 28px 20px;
}
.profile-hero-split .info-side{flex:1 1 320px; min-width:280px;}
.profile-hero-split .portrait-side{flex:0 0 360px; position:relative; order:2;}
.portrait-frame{position:relative; perspective:900px;}
.portrait-glow{
  position:absolute; inset:-56px; z-index:0; filter:blur(38px); opacity:.4; border-radius:50%;
  background:radial-gradient(circle, var(--pcolor), transparent 70%);
}
.portrait-img{
  position:relative; z-index:1; width:100%; display:block; filter:drop-shadow(0 24px 40px rgba(0,0,0,.55));
  transition:transform .24s ease, opacity .24s ease, filter .24s ease; cursor:pointer;
}
.portrait-img[title]:not([title=""]):hover{ transform:scale(1.015); }
.portrait-img.portrait-flip-out{
  transform:scale(.82) rotateY(14deg); opacity:0; filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) blur(10px) brightness(1.6);
}
.portrait-img.portrait-flip-in{ animation:portraitWarpIn .42s cubic-bezier(.2,.8,.2,1); }
@keyframes portraitWarpIn{
  0%{ transform:scale(.82) rotateY(-14deg); opacity:0; filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) blur(10px) brightness(1.6); }
  60%{ filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) blur(0px) brightness(1.15); }
  100%{ transform:scale(1) rotateY(0deg); opacity:1; filter:drop-shadow(0 24px 40px rgba(0,0,0,.55)) blur(0) brightness(1); }
}
.photo-dots{display:flex; gap:7px; justify-content:center; margin-top:16px;}
.photo-dot{width:7px; height:7px; border-radius:50%; background:var(--line); transition:.25s;}

<body>

<canvas id="stars"></canvas>
<div id="grain"></div>

<header class="topnav">
  <div class="brand" onclick="location.hash='#/home'">
    <div class="mark"></div>
    <div class="name">Yoshe con <em>Hoyo</em></div>
  </div>
  <div style="display:flex; align-items:center; gap:14px;">
    <nav class="seasons-strip" id="seasonsStrip"></nav>
    <div class="toolbar">
      <button class="tool-btn" title="Buscar" onclick="toggleSearch()">🔍</button>
      <button class="tool-btn" title="Mapa de relaciones" onclick="location.hash='#/map'">🕸️</button>
      <button class="tool-btn" title="Historia aleatoria" onclick="goRandomStory()">🎲</button>
      <button class="tool-btn" id="editToggleBtn" title="Modo edición" onclick="toggleEditMode()">✏️</button>
    </div>
  </div>
</header>

<div id="searchOverlay" class="search-overlay">
  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Busca un personaje, lugar o palabra dentro de una historia…" oninput="runSearch(this.value)">
    <button class="tool-btn" onclick="toggleSearch()">✕</button>
  </div>
  <div id="searchResults" class="search-results"></div>
</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="edit-bar">
  <span class="edit-tag">✏️ Modo edición activo — los cambios se guardan en este navegador</span>
  <button onclick="exportOverrides()">⬇ Exportar cambios</button>
  <button onclick="document.getElementById('importFile').click()">⬆ Importar cambios</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importOverridesFile(this)">
</div>

<div id="app"></div>

<script src="data.js"></script>
<script>
/* =========================================================================
   PERSISTENCIA LOCAL (modo edición)
   Los cambios hechos desde la página (bios, apodos, frases, habilidades,
   hitos, títulos y nuevos eventos) se guardan en localStorage del navegador
   y se re-aplican sobre DATA cada vez que se carga la página. No es una
   base de datos compartida: vive solo en este navegador/dispositivo.
   Usa "Exportar cambios" para respaldarlos o pasarlos a otro dispositivo.
   ========================================================================= */
const OV_KEY = "ychOverrides_v1";
function loadOverrides(){
  try{ return JSON.parse(localStorage.getItem(OV_KEY)) || {characters:{}, places:{}, seasonMeta:{}, extraEvents:{}, armageddon:{}}; }
  catch(e){ return {characters:{}, places:{}, seasonMeta:{}, extraEvents:{}, armageddon:{}}; }
}
function saveOverrides(ov){ try{ localStorage.setItem(OV_KEY, JSON.stringify(ov)); }catch(e){ /* storage unavailable — edits won't persist across reloads in this context */ } }
function applyOverrides(){
  const ov = loadOverrides();
  Object.entries(ov.characters||{}).forEach(([id,patch])=>{ if(DATA.characters[id]) Object.assign(DATA.characters[id], patch); });
  Object.entries(ov.places||{}).forEach(([id,patch])=>{ if(DATA.places[id]) Object.assign(DATA.places[id], patch); });
  Object.entries(ov.seasonMeta||{}).forEach(([sid,patch])=>{ const s=DATA.seasons.find(x=>String(x.id)===String(sid)); if(s) Object.assign(s, patch); });
  Object.entries(ov.extraEvents||{}).forEach(([sid,events])=>{ const s=DATA.seasons.find(x=>String(x.id)===String(sid)); if(s) events.forEach(e=>s.events.push(e)); });
  if(ov.armageddon) Object.assign(DATA.armageddon, ov.armageddon);
}
applyOverrides();

function patchCharacter(id, patch){
  Object.assign(DATA.characters[id], patch);
  const ov = loadOverrides();
  ov.characters[id] = Object.assign(ov.characters[id]||{}, patch);
  saveOverrides(ov);
}
function patchPlace(id, patch){
  Object.assign(DATA.places[id], patch);
  const ov = loadOverrides();
  ov.places[id] = Object.assign(ov.places[id]||{}, patch);
  saveOverrides(ov);
}
function patchArmageddon(patch){
  Object.assign(DATA.armageddon, patch);
  const ov = loadOverrides();
  ov.armageddon = Object.assign(ov.armageddon||{}, patch);
  saveOverrides(ov);
}
function patchSeasonMeta(seasonId, patch){
  const s = DATA.seasons.find(x=>String(x.id)===String(seasonId));
  if(s) Object.assign(s, patch);
  const ov = loadOverrides();
  ov.seasonMeta[seasonId] = Object.assign(ov.seasonMeta[seasonId]||{}, patch);
  saveOverrides(ov);
}
function addEventToSeason(seasonId, eventObj){
  const s = DATA.seasons.find(x=>String(x.id)===String(seasonId));
  if(s) s.events.push(eventObj);
  const ov = loadOverrides();
  ov.extraEvents[seasonId] = ov.extraEvents[seasonId]||[];
  ov.extraEvents[seasonId].push(eventObj);
  saveOverrides(ov);
}
function exportOverrides(){
  const ov = loadOverrides();
  const blob = new Blob([JSON.stringify(ov,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "yoshe-con-hoyo-cambios.json";
  a.click();
}
function importOverridesFile(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      saveOverrides(parsed);
      alert("Cambios importados. La página se va a recargar.");
      location.reload();
    }catch(e){ alert("Ese archivo no tiene un formato válido."); }
  };
  reader.readAsText(file);
}

/* =========================== auto-detección de nombres =========================== */
function buildNameIndex(){
  const items=[];
  const firstNameCount={};
  Object.values(DATA.characters).forEach(c=>{
    const fn=c.name.split(" ")[0];
    firstNameCount[fn]=(firstNameCount[fn]||0)+1;
  });
  Object.entries(DATA.characters).forEach(([id,c])=>{
    items.push({id,name:c.name,type:"char"});
    const fn=c.name.split(" ")[0];
    if(firstNameCount[fn]===1 && fn!==c.name) items.push({id,name:fn,type:"char"});
    if(c.apodo) items.push({id,name:c.apodo,type:"char"});
  });
  Object.entries(DATA.places).forEach(([id,p])=>items.push({id,name:p.name,type:"place"}));
  items.sort((a,b)=>b.name.length-a.name.length);
  return items;
}
function autoTagText(text){
  const items = buildNameIndex();
  if(!items.length || !text) return [{t:"text", v:text||""}];
  const esc = s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const pattern = items.map(it=>esc(it.name)).join("|");
  const re = new RegExp("("+pattern+")","g");
  const parts = text.split(re);
  const segs=[];
  parts.forEach(part=>{
    if(part===undefined || part==="") return;
    const found = items.find(it=>it.name===part);
    if(found) segs.push({t:found.type, id:found.id});
    else segs.push({t:"text", v:part});
  });
  return segs;
}

/* =========================== BUSCADOR =========================== */
function toggleSearch(){
  const ov = document.getElementById("searchOverlay");
  ov.classList.toggle("active");
  if(ov.classList.contains("active")){
    setTimeout(()=>document.getElementById("searchInput").focus(), 50);
    document.getElementById("searchInput").value="";
    document.getElementById("searchResults").innerHTML = `<div class="search-empty">Escribe para buscar…</div>`;
  }
}
function runSearch(q){
  const box = document.getElementById("searchResults");
  const query = q.trim().toLowerCase();
  if(query.length<2){ box.innerHTML = `<div class="search-empty">Escribe al menos 2 letras…</div>`; return; }

  const charMatches = Object.entries(DATA.characters).filter(([id,c])=>
    c.name.toLowerCase().includes(query) || (c.apodo&&c.apodo.toLowerCase().includes(query)) || (c.role&&c.role.toLowerCase().includes(query))
  );
  const placeMatches = Object.entries(DATA.places).filter(([id,p])=>
    p.name.toLowerCase().includes(query) || (p.desc&&p.desc.toLowerCase().includes(query))
  );
  const eventMatches = allEventsFlat().filter(r=>{
    const text = r.event.title + " " + r.event.content.filter(s=>s.t==="text").map(s=>s.v).join(" ");
    return text.toLowerCase().includes(query);
  });

  if(!charMatches.length && !placeMatches.length && !eventMatches.length){
    box.innerHTML = `<div class="search-empty">Sin resultados para "${escapeHtml(q)}"</div>`; return;
  }

  let html="";
  if(charMatches.length){
    html += `<div class="search-result-group"><h4>Personajes</h4>` + charMatches.map(([id,c])=>
      `<div class="search-result-item" onclick="toggleSearch();navigateTo('character','${id}')">
        <div class="srn">${escapeHtml(c.name)}</div><div class="srd">${escapeHtml(c.role)}</div>
      </div>`).join("") + `</div>`;
  }
  if(placeMatches.length){
    html += `<div class="search-result-group"><h4>Lugares</h4>` + placeMatches.map(([id,p])=>
      `<div class="search-result-item" onclick="toggleSearch();navigateTo('place','${id}')">
        <div class="srn">${p.icon} ${escapeHtml(p.name)}</div>
      </div>`).join("") + `</div>`;
  }
  if(eventMatches.length){
    html += `<div class="search-result-group"><h4>Historias</h4>` + eventMatches.map(r=>
      `<div class="search-result-item" onclick="toggleSearch();location.hash='#/season/${r.season.id}';setTimeout(()=>flashEvent(${r.season.id},${r.index}),120)">
        <div class="srn">${escapeHtml(r.event.title)}</div><div class="srd">${r.season.code} · ${escapeHtml(r.event.date)}</div>
      </div>`).join("") + `</div>`;
  }
  box.innerHTML = html;
}

/* =========================== HISTORIA ALEATORIA =========================== */
function goRandomStory(){
  const all = allEventsFlat();
  if(!all.length){ alert("Todavía no hay historias cargadas."); return; }
  const pick = all[Math.floor(Math.random()*all.length)];
  location.hash = `#/season/${pick.season.id}`;
  setTimeout(()=>flashEvent(pick.season.id, pick.index), 150);
}

/* =========================== MODO EDICIÓN =========================== */
function isEditOn(){ try{ return localStorage.getItem("ychEditOn")==="1"; }catch(e){ return false; } }
function toggleEditMode(){
  const on = !isEditOn();
  try{ localStorage.setItem("ychEditOn", on?"1":"0"); }catch(e){ /* storage unavailable (e.g. sandboxed preview) — continue without persisting */ }
  document.body.classList.toggle("edit-on", on);
  document.getElementById("editToggleBtn").classList.toggle("active", on);
  render();
}
function openModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalOverlay").classList.add("active");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("active"); }

function openCharEditModal(id){
  const c = DATA.characters[id];
  openModal(`
    <h3>Editar a ${escapeHtml(c.name)}</h3>
    <label>Foto de perfil</label>
    <div style="display:flex; align-items:center; gap:12px;">
      ${c.photo ? `<img src="${c.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">` : ""}
      <input type="file" id="f_photo" accept="image/*">
    </div>
    <label>Rol / apodo funcional</label><input id="f_role" value="${escapeHtml(c.role||"")}">

function resizeImageFile(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
      const canvas = document.createElement("canvas");
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      cb(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function allEventsFlat(){
  const out=[];
  DATA.seasons.forEach(s=>s.events.forEach((e,i)=>out.push({season:s, event:e, index:i})));
  return out;
}
function characterStats(id){
  const related = allEventsFlat().filter(x=>x.event.chars.includes(id));
  const seasonSet = [...new Set(related.map(r=>r.season.code))];
  const placeCounts = {}, coCharCounts = {};
  related.forEach(r=>{
    if(r.event.place) placeCounts[r.event.place] = (placeCounts[r.event.place]||0)+1;
    r.event.chars.forEach(cid=>{ if(cid!==id) coCharCounts[cid]=(coCharCounts[cid]||0)+1; });
  });
  const topOf = obj => Object.entries(obj).sort((a,b)=>b[1]-a[1])[0];
  const topPlace = topOf(placeCounts);
  const topCoChar = topOf(coCharCounts);
  const first = related[0];
  return {
    count: related.length,
    seasons: seasonSet,
    topPlace: topPlace ? DATA.places[topPlace[0]] : null,
    topCoChar: topCoChar ? DATA.characters[topCoChar[0]] : null,
    topCoCharId: topCoChar ? topCoChar[0] : null,
    first
  };
}
function placeStats(id){
  const related = allEventsFlat().filter(x=>x.event.place===id);
  const seasonSet = [...new Set(related.map(r=>r.season.code))];
  const charCounts = {};
  related.forEach(r=>r.event.chars.forEach(cid=>{ charCounts[cid]=(charCounts[cid]||0)+1; }));
  const topOf = obj => Object.entries(obj).sort((a,b)=>b[1]-a[1])[0];
  const topChar = topOf(charCounts);
  return {
    count: related.length,
    seasons: seasonSet,
    topChar: topChar ? DATA.characters[topChar[0]] : null,
    topCharId: topChar ? topChar[0] : null
  };
}
function initials(name){
  return name.split(" ").filter(w=>w[0]===w[0].toUpperCase()).slice(0,2).map(w=>w[0]).join("").slice(0,2) || name.slice(0,2);

function avatarInner(c){
  if(c.photo) return `<img src="${c.photo}" alt="${escapeHtml(c.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">`;
  return initials(c.name);

function getPhotos(c){
  if(Array.isArray(c.photos) && c.photos.length) return c.photos;
  if(c.photoLarge) return [c.photoLarge];
  return [];
}
function cyclePhoto(imgEl){
  const id = imgEl.dataset.id;
  const c = DATA.characters[id];
  if(!c) return;
  const photos = getPhotos(c);
  if(photos.length < 2) return;
  const idx = parseInt(imgEl.dataset.idx, 10);
  const nextIdx = (idx + 1) % photos.length;
  imgEl.classList.add("portrait-flip-out");
  setTimeout(()=>{
    imgEl.src = photos[nextIdx];
    imgEl.dataset.idx = nextIdx;
    imgEl.classList.remove("portrait-flip-out");
    imgEl.classList.add("portrait-flip-in");
    setTimeout(()=>imgEl.classList.remove("portrait-flip-in"), 420);
    const frame = imgEl.closest(".portrait-frame");
    const dots = frame ? frame.querySelectorAll(".photo-dot") : [];
    dots.forEach((d,i)=>d.classList.toggle("active", i===nextIdx));
  }, 240);
}
function renderContent(content){
  return content.map(seg=>{
    if(seg.t==="text") return escapeHtml(seg.v);
    if(seg.t==="char"){
      const c=DATA.characters[seg.id]; if(!c) return "";
      return `<span class="tag-char" onclick="event.stopPropagation();navigateTo('character','${seg.id}')">${escapeHtml(c.name)}</span>`;

    if(seg.t==="place"){

      return `<span class="tag-place" onclick="event.stopPropagation();navigateTo('place','${seg.id}')">${escapeHtml(p.name)}</span>`;
    }
    return "";
  }).join("");
}

/* =========================== render: HOME =========================== */
function viewHome(){
  renderSeasonsStrip(undefined);
  const app=document.getElementById("app");

  // Hand-arranged constellation layout (percent coordinates) — not a circle, like a scattered star chart.
  // Two layouts: a wide scatter for the 16:9 desktop box, a tall serpentine for the 3:4 mobile box
  // (stretching one set of points across both boxes made the lines steep and chunky on narrow screens).
  const isNarrow = window.matchMedia("(max-width:600px)").matches;
  const CONSTELLATION_POS = isNarrow ? [
    {x:32, y:7},  {x:74, y:19}, {x:22, y:36},
    {x:70, y:52}, {x:26, y:68}, {x:66, y:85}
  ] : [
    {x:7,  y:68}, {x:23, y:26}, {x:40, y:52},
    {x:59, y:15}, {x:76, y:44}, {x:94, y:22}
  ];
  const ARMAGEDDON_POS = isNarrow ? {x:50, y:96} : {x:96, y:88};

  // The star nodes are plain positioned divs (left/top %), so they don't care about the
  // svg's own coordinate system - but the connecting <path>s do. A 100x100 viewBox stretched
  // non-uniformly onto a 16:9 (or 3:4) box via preserveAspectRatio="none" used to make the
  // *visual* curve line up with the divs, but it also meant path-length-based math (the dash
  // draw-in below) was computed in a squashed space that didn't match the rendered geometry -
  // stroke-dasharray/getTotalLength() and vector-effect:non-scaling-stroke disagreed about
  // what "the whole line" meant, so the draw-in animation stalled a few percent in. Building
  // the viewBox in the box's real aspect ratio (and rescaling only the Y going into the path
  // data) keeps the scale uniform, so both agree again.
  const vbH = isNarrow ? 100 * (4/3) : 100 * (9/16);
  const toVB = p => ({x:p.x, y:p.y*vbH/100});

  // gentle arcs instead of straight zigzag segments, alternating bow direction, colored by a
  // gradient between each pair of season colors
  const linesSvg = DATA.seasons.slice(1).map((s,i)=>{
    const a = toVB(CONSTELLATION_POS[i]), b = toVB(CONSTELLATION_POS[i+1]);
    const prev = DATA.seasons[i];
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = b.x-a.x, dy = b.y-a.y;
    const bow = (i%2===0? 1 : -1) * 6;
    const len = Math.hypot(dx,dy) || 1;
    const cx = mx + (-dy/len)*bow, cy = my + (dx/len)*bow;
    const gid = `seg-grad-${i}`;
    return `<defs><linearGradient id="${gid}" x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%">
        <stop offset="0%" stop-color="${prev.color}" stop-opacity=".55"/>
        <stop offset="100%" stop-color="${s.color}" stop-opacity=".55"/>
      </linearGradient></defs>
      <path class="constellation-line" data-idx="${i}" stroke="url(#${gid})" d="M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}"></path>`;
  }).join("");

  const microStars = Array.from({length:26}, (_,i)=>{
    const x = (i*37.4113) % 100, y = (i*61.803) % 100;
    const size = (2 + (i%5)*0.7).toFixed(1);
    const delay = (i*0.71) % 4.5;
    return `<div class="micro-star" style="left:${x}%; top:${y}%; width:${size}px; height:${size}px; animation-delay:${delay}s"></div>`;
  }).join("");

  const seasonNodesHtml = DATA.seasons.map((s,i)=>{
    const p = CONSTELLATION_POS[i] || {x:50,y:50};
    const bdelay = ((i*0.63) % 3.6).toFixed(2);
    const idelay = (0.55 + i*0.13).toFixed(2);
    return `<div class="star-node ${s.id===0?'s0':''}" data-nodeidx="${i}" style="left:${p.x}%; top:${p.y}%; --pcolor:${s.color}; --bdelay:${bdelay}s; --idelay:${idelay}s" onclick="location.hash='#/season/${s.id}'">
      <div class="star-dot"></div>
      <div class="star-code" style="color:${s.color}">${s.code}</div>
      <div class="star-label">${escapeHtml(s.title)}</div>
    </div>`;
  }).join("");

  const armageddonIdelay = (0.55 + DATA.seasons.length*0.13 + 0.2).toFixed(2);
  const armageddonNode = `<div class="star-node armageddon-node" style="left:${ARMAGEDDON_POS.x}%; top:${ARMAGEDDON_POS.y}%; --idelay:${armageddonIdelay}s" onclick="location.hash='#/armageddon'">
    <div class="star-dot"></div>
    <div class="star-code">†</div>
    <div class="star-label">armagedón</div>
  </div>`;

  const castCard = ([id,c])=>`
    <div class="cast-card" onclick="navigateTo('character','${id}')">
      <div class="cast-avatar" style="background:${c.photo?'transparent':c.color}; overflow:hidden;">${avatarInner(c)}</div>
      <div class="cname">${escapeHtml(c.name)}</div>
      <div class="crole">${escapeHtml(c.role)}</div>
      <div class="tier-badge tier-${c.tier==='secundario'?'sec':'pri'}">${c.tier==='secundario'?'Secundario':'Primario'}</div>
    </div>`;
  const entries = Object.entries(DATA.characters);
  const primaryHtml = entries.filter(([,c])=>c.tier!=='secundario').map(castCard).join("");
  const secondaryHtml = entries.filter(([,c])=>c.tier==='secundario').map(castCard).join("");

  const placesHtml = Object.entries(DATA.places).map(([id,p])=>`
    <div class="place-card" onclick="navigateTo('place','${id}')">
      <span class="picon">${p.icon}</span>
      <div class="pname">${escapeHtml(p.name)}</div>
      <div class="pdesc">${escapeHtml(p.desc)}</div>
    </div>`).join("");

  // the hero's "ignite" entrance only plays once per browser session, and never under
  // prefers-reduced-motion - a returning visit (or a second trip back to #/home) just
  // renders the final state directly instead of replaying the reveal
  const INTRO_KEY = "ychHeroIntroPlayed";
  let playIntro = false;
  try{
    playIntro = !sessionStorage.getItem(INTRO_KEY) && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }catch(e){ playIntro = false; }

  app.innerHTML = `
  <section class="hero${playIntro?' intro-play':''}">
    <div class="eyebrow">La crónica de un grupo de amigos</div>
    <h1>Yoshe con <em>Hoyo</em></h1>
    <p class="tag">Cinco temporadas (y una S0) de historias, viajes y desastres compartidos.
    Elige una estrella para caer dentro de esa temporada.</p>
    <div class="constellation-wrap">
      <div class="constellation-tilt" id="constellationTilt">
        <svg id="constellationSvg" viewBox="0 0 100 ${vbH.toFixed(3)}" preserveAspectRatio="none">${linesSvg}</svg>
        ${microStars}${seasonNodesHtml}${armageddonNode}
      </div>
    </div>
    <div class="scroll-cue">Explora el elenco y los lugares<div class="chevron"></div></div>
  </section>

  <section class="section-wrap">
    <div class="section-head">
      <div class="eyebrow">Elenco · principales</div>
      <h2>Los personajes</h2>
    </div>
    <div class="grid-cast">${primaryHtml}</div>
  </section>

  <section class="section-wrap" style="padding-top:0;">
    <div class="section-head">
      <div class="eyebrow">Elenco · secundarios</div>
      <h2>Apariciones especiales</h2>
    </div>
    <div class="grid-cast">${secondaryHtml || '<div style="color:var(--ink-dim); font-size:.9rem;">Todavía no hay personajes secundarios.</div>'}</div>
  </section>

  <section class="section-wrap">
    <div class="section-head">
      <div class="eyebrow">Escenarios</div>
      <h2>Los lugares</h2>
    </div>
    <div class="grid-places">${placesHtml}</div>
  </section>

  <footer class="site-footer">Yoshe con Hoyo · una crónica en construcción · S0 → S5</footer>
  `;

  if(playIntro){ try{ sessionStorage.setItem(INTRO_KEY, "1"); }catch(e){} }
  setupConstellationFX();
}

// lines fade in one after another on first appearance, and glow along the pair connected
// to whichever season star you're hovering - both purely visual, both skipped under
// prefers-reduced-motion (the paths just render fully drawn, hover highlight still works
// since it's an instant class toggle, not an animation).
// NOTE: this used to be a stroke-dasharray "hand drawn" reveal, but Chromium's dash-pattern
// layout for vector-effect:non-scaling-stroke paths doesn't match what getTotalLength()
// reports once any scale transform is involved (confirmed by testing: the exact same
// dasharray/dashoffset values render a full line with non-scaling-stroke off, and a few
// percent of it with non-scaling-stroke on) - so the "on" dash only ever covered the first
// few percent of each curve, never the whole line. A plain fade sidesteps the bug entirely.
function setupConstellationFX(){
  const svg = document.getElementById("constellationSvg");
  const wrap = document.querySelector(".constellation-wrap");
  if(!svg || !wrap) return;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const paths = Array.from(svg.querySelectorAll(".constellation-line"));

  if(!reduced && paths.length){
    paths.forEach((p,i)=>{
      p.style.opacity = "0";
      p.style.transition = `opacity .85s ease ${(i*0.12).toFixed(2)}s, stroke-width .25s, filter .25s`;
    });
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          paths.forEach(p=>{ p.style.opacity = "1"; });
          io.disconnect();
        }
      });
    }, {threshold:0.3});
    io.observe(wrap);
  }

  wrap.querySelectorAll(".star-node[data-nodeidx]").forEach(node=>{
    const idx = Number(node.dataset.nodeidx);
    const related = svg.querySelectorAll(`.constellation-line[data-idx="${idx-1}"], .constellation-line[data-idx="${idx}"]`);
    node.addEventListener("mouseenter", ()=> related.forEach(p=>p.classList.add("line-hot")));
    node.addEventListener("mouseleave", ()=> related.forEach(p=>p.classList.remove("line-hot")));
  });
}

      <div class="tl-progress" id="tlProgress" style="background:linear-gradient(to bottom, ${s.color}, var(--violet))"></div>
      ${eventsHtml}
    </div>
  `;
  setupScrollReveal();
  setupTimelineProgress();
}

function setupScrollReveal(){
  const items=document.querySelectorAll(".event");
  const obs = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting) en.target.classList.add("visible"); });
  }, {threshold:0.18});
  items.forEach(it=>obs.observe(it));
}
function setupTimelineProgress(){
  const tl=document.getElementById("timeline");
  const bar=document.getElementById("tlProgress");
  if(!tl||!bar) return;
  function onScroll(){
    const rect=tl.getBoundingClientRect();
    const vh=window.innerHeight;
    const total = rect.height;
    const scrolled = Math.min(Math.max(vh*0.5 - rect.top, 0), total);
    bar.style.height = (scrolled/total*100)+"%";
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
}

function viewMap(){
  renderSeasonsStrip(undefined);
  const app=document.getElementById("app");
  const ids = Object.keys(DATA.characters);
  const n = ids.length;
  const cx=300, cy=300, r=230;
  const pos = {};
  ids.forEach((id,i)=>{
    const angle = (i/n)*2*Math.PI - Math.PI/2;
    pos[id] = { x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) };
  });

  // co-occurrence weights
  const weights = {};
  allEventsFlat().forEach(r=>{
    const chars = r.event.chars;
    for(let i=0;i<chars.length;i++){
      for(let j=i+1;j<chars.length;j++){
        const key = [chars[i],chars[j]].sort().join("|");
        weights[key] = (weights[key]||0)+1;
      }
    }
  });

  const edgesSvg = Object.entries(weights).map(([key,w])=>{
    const [a,b] = key.split("|");
    if(!pos[a]||!pos[b]) return "";
    return `<line class="map-edge" x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}" stroke-width="${Math.min(1+w*1.2, 8)}"></line>`;
  }).join("");

  const nodesSvg = ids.map(id=>{
    const c = DATA.characters[id];
    const p = pos[id];
    const rad = c.tier==="secundario" ? 16 : 22;
    return `
      <g onclick="navigateTo('character','${id}')" style="cursor:pointer;">
        <circle class="map-node-circle" cx="${p.x}" cy="${p.y}" r="${rad}" fill="${c.color}"></circle>
        <text class="map-node-label" x="${p.x}" y="${p.y+rad+14}">${escapeHtml(c.name.split(" ")[0])}</text>
      </g>`;
  }).join("");

  const noEdges = Object.keys(weights).length===0;

  app.innerHTML = `
    <section class="season-hero" style="border-bottom:none;">
      <div class="scode-big" style="color:var(--violet)">MAPA</div>
      <h1>Red de relaciones</h1>
      <p class="hito">Quiénes han compartido más historias entre sí. El grosor de la línea indica cuántas historias los conectan.</p>
    </section>
    <div class="map-wrap">
      <div class="map-svg-wrap">
        <svg viewBox="0 0 600 600" width="100%" height="100%">
          ${edgesSvg}
          ${nodesSvg}
        </svg>
      </div>
      ${noEdges ? `<div class="map-legend">Todavía no hay suficientes historias con más de un personaje para trazar conexiones.</div>` : `<div class="map-legend">Toca un nombre para ir a su perfil.</div>`}
    </div>
  `;
}

(function(){
  // the constellation uses a different point layout above/below the 600px breakpoint
  // (see viewHome), so crossing it needs a re-render, not just a redraw of the same points
  let resizeTimer;
  const mq = window.matchMedia("(max-width:600px)");
  let wasNarrow = mq.matches;
  window.addEventListener("resize", ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const nowNarrow = mq.matches;
      const onHome = !location.hash || location.hash==="#/" || location.hash==="#/home";
      if(onHome && nowNarrow!==wasNarrow) viewHome();
      wasNarrow = nowNarrow;
    }, 200);
  });
})();

/* starfield background */
try{
(function starfield(){
  const c=document.getElementById("stars");
  const ctx=c.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars=[], nebulae=[], shots=[];
  let rafId=null, lastT=0, shotCooldown=3+Math.random()*4;
  const nebulaColors=["60,140,230","70,185,225","130,180,255","90,160,240"];

  // a soft diagonal "galaxy arm" band, like the Milky Way core in a real night-sky photo:
  // stars are denser and the sky itself is tinted brighter along this line
  let band = {a:0,b:0,c:0,halfW:0};
  function setBand(){
    // line through two fractional points of the canvas, band angle echoes the CSS body gradient
    const p1={x:c.width*0.06, y:c.height*0.22}, p2={x:c.width*0.82, y:c.height*0.06};
    const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
    band = {nx:-dy/len, ny:dx/len, px:p1.x, py:p1.y, halfW: Math.max(c.width,420)*0.16};
  }
  function bandDist(x,y){ return (x-band.px)*band.nx + (y-band.py)*band.ny; }

  // three brightness tiers so the sky has real depth: dim distant dust, mid-field stars,
  // and a handful of vivid electric-blue "feature" stars (some rendered as 4-point glints)
  // for contrast between dark blue voids and bright blue points, like the reference photos.
  function makeStar(onBand){
    const roll = Math.random();
    let s;
    if(roll<0.58){
      s = { tier:0, r:Math.random()*0.9+0.2, base:Math.random()*0.3+0.08, color:"170,195,230",
        glow:false, sparkle:false, speed:0.3+Math.random()*0.5,
        vx:(Math.random()-0.5)*0.01, vy:(Math.random()*0.4+0.1)*0.01 };
    } else if(roll<0.90){
      s = { tier:1, r:Math.random()*1.1+0.5, base:Math.random()*0.45+0.3, color:"224,238,255",
        glow:false, sparkle:false, speed:0.4+Math.random()*0.7,
        vx:(Math.random()-0.5)*0.012, vy:(Math.random()*0.5+0.15)*0.012 };
    } else {
      s = { tier:2, r:Math.random()*1.1+1.2, base:Math.random()*0.3+0.65, color:"175,228,255",
        glow:true, sparkle:Math.random()<0.4, speed:0.5+Math.random()*0.6,
        vx:(Math.random()-0.5)*0.014, vy:(Math.random()*0.5+0.15)*0.014 };
    }
    if(onBand){
      const d = (Math.random()-0.5)*2*band.halfW*0.5;
      const along = Math.random()*Math.max(c.width,c.height)*1.3 - Math.max(c.width,c.height)*0.15;
      s.x = band.px + band.nx*d - band.ny*along;
      s.y = band.py + band.ny*d + band.nx*along;
    } else {
      s.x = Math.random()*c.width; s.y = Math.random()*c.height;
    }
    s.phase = Math.random()*Math.PI*2;
    return s;
  }

  function resize(){
    c.width=window.innerWidth; c.height=document.documentElement.scrollHeight;
    setBand();
    const area = c.width*c.height;
    const baseCount = Math.min(820, Math.max(140, Math.round(area/9500)));
    const bandCount = Math.min(360, Math.max(60, Math.round(area/16000)));
    stars = Array.from({length: baseCount}, ()=>makeStar(false))
      .concat(Array.from({length: bandCount}, ()=>makeStar(true)));
    // wispy nebula clouds: each is a cluster of 3-4 soft overlapping puffs, not one clean circle
    nebulae = Array.from({length: Math.max(3, Math.floor(c.height/650))}, (_,i)=>{
      const cx=Math.random()*c.width, cy=Math.random()*c.height;
      const color = nebulaColors[i%nebulaColors.length];
      const baseR = Math.random()*220+160;
      const puffs = Array.from({length:3+Math.floor(Math.random()*2)}, ()=>({
        dx:(Math.random()-0.5)*baseR*1.4, dy:(Math.random()-0.5)*baseR*1.1,
        r: baseR*(0.55+Math.random()*0.6)
      }));
      return { x:cx, y:cy, r:baseR, color, puffs,
        base:Math.random()*0.045+0.028, phase:Math.random()*Math.PI*2,
        vx:(Math.random()-0.5)*0.006, vy:(Math.random()-0.5)*0.006 };
    });
    if(reduced){ drawStatic(); }
  }

  function paintNebula(n, breathe){
    n.puffs.forEach(p=>{
      const px=n.x+p.dx, py=n.y+p.dy, pr=p.r*breathe;
      const grad = ctx.createRadialGradient(px,py,0,px,py,pr);
      grad.addColorStop(0, `rgba(${n.color},${(n.base*breathe).toFixed(3)})`);
      grad.addColorStop(1, `rgba(${n.color},0)`);
      ctx.fillStyle=grad;
      ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();

  function paintStar(s, a){
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(${s.color},${Math.max(0,a).toFixed(3)})`;
    if(s.glow){ ctx.shadowColor="rgba(150,215,255,.95)"; ctx.shadowBlur=9; } else{ ctx.shadowBlur=0; }

      const len = s.r*7.5*a;
      const grad = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,len);
      grad.addColorStop(0, `rgba(220,240,255,${(a*0.5).toFixed(3)})`);

  function maybeSpawnShot(dt){
    shotCooldown -= dt;
    if(shotCooldown>0) return;
    shotCooldown = 4.5+Math.random()*6;
    const fromLeft = Math.random()<0.5;
    const x = fromLeft ? -20 : c.width+20;
    const y = Math.random()*c.height*0.55;

    stars.forEach(s=>{

      if(s.x<-5) s.x=c.width+5; if(s.x>c.width+5) s.x=-5;
      if(s.y<-5) s.y=c.height+5; if(s.y>c.height+5) s.y=-5;

    nebulae.forEach(n=>{
      n.x += n.vx; n.y += n.vy;
      if(n.x<-n.r) n.x=c.width+n.r; if(n.x>c.width+n.r) n.x=-n.r;
      if(n.y<-n.r) n.y=c.height+n.r; if(n.y>c.height+n.r) n.y=-n.r;
    });
    maybeSpawnShot(dt||0.016);
    shots.forEach(sh=>{ sh.x+=sh.vx*dt; sh.y+=sh.vy*dt; sh.life+=dt; });
    shots = shots.filter(sh=> sh.life<sh.maxLife && sh.x>-60 && sh.x<c.width+60 && sh.y<c.height+60);

    ctx.clearRect(0,0,c.width,c.height);

    // slow continuous drift of the whole sky (independent of per-star twinkle), so the
    // universe itself feels like it's gently panning rather than merely twinkling in place
    const driftX = Math.sin(t*0.000022)*22;
    const driftY = Math.cos(t*0.000017)*14;
    ctx.save();
    ctx.translate(driftX, driftY);

    nebulae.forEach(n=>{
      const breathe = 0.85+0.15*Math.sin(t*0.00006+n.phase);
      paintNebula(n, breathe);
    });
    stars.forEach(s=>{
      const a = s.base*(0.55+0.45*Math.sin(t*0.001*s.speed+s.phase));
      paintStar(s, a);
    });
    shots.forEach(sh=>{
      const p = sh.life/sh.maxLife;
      const fade = p<0.15 ? p/0.15 : 1-((p-0.15)/0.85);
      const tailX = sh.x - sh.vx*0.055, tailY = sh.y - sh.vy*0.055;
      const grad = ctx.createLinearGradient(tailX,tailY,sh.x,sh.y);
      grad.addColorStop(0, "rgba(210,230,255,0)");
      grad.addColorStop(1, `rgba(255,255,255,${(0.9*fade).toFixed(3)})`);
      ctx.strokeStyle=grad; ctx.lineWidth=1.7; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(tailX,tailY); ctx.lineTo(sh.x,sh.y); ctx.stroke();
      const headGlow = ctx.createRadialGradient(sh.x,sh.y,0,sh.x,sh.y,10);
      headGlow.addColorStop(0, `rgba(255,255,255,${(0.7*fade).toFixed(3)})`);
      headGlow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle=headGlow;
      ctx.beginPath(); ctx.arc(sh.x,sh.y,10,0,Math.PI*2); ctx.fill();
    });

    ctx.restore();
    rafId = requestAnimationFrame(draw);
  }

  function start(){ if(rafId===null){ lastT=0; rafId = requestAnimationFrame(draw); } }
  function stop(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } }

  window.addEventListener("resize", resize);
  window.addEventListener("hashchange", ()=>setTimeout(resize,80));
  document.addEventListener("visibilitychange", ()=>{
    if(reduced) return;
    if(document.hidden) stop(); else start();
  });
  setTimeout(()=>{ resize(); if(!reduced) start(); }, 120);
})();
}catch(e){ /* decorative starfield failing should never block the app */ }

// hero depth: (a) the star canvas scrolls slower than the page (distance parallax), and
// (b) the constellation recedes/fades as the hero scrolls past, while (c) it tilts gently
// toward the pointer on hover-capable devices - all three share one rAF loop since they're
// just cheap transform writes, no layout thrash. Skips entirely under reduced motion.
try{
  const heroReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!heroReduced){
    const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    let rafId = null;
    let targetTiltX = 0, targetTiltY = 0, tiltX = 0, tiltY = 0;

    if(canHover){
      document.addEventListener("pointermove", (e)=>{
        const wrap = document.querySelector(".constellation-wrap");
        if(!wrap) return;
        const r = wrap.getBoundingClientRect();
        const px = (e.clientX - (r.left + r.width/2)) / (r.width/2 || 1);
        const py = (e.clientY - (r.top + r.height/2)) / (r.height/2 || 1);
        targetTiltX = Math.max(-1, Math.min(1, px)) * 11;
        targetTiltY = Math.max(-1, Math.min(1, py)) * 8;
      });
    }

    function tick(){
      const starsEl = document.getElementById("stars");
      if(starsEl) starsEl.style.transform = `translateY(${(window.scrollY*0.35).toFixed(1)}px)`;

      const hero = document.querySelector(".hero");
      if(hero){
        const rect = hero.getBoundingClientRect();
        const span = rect.height || window.innerHeight;
        const progress = Math.min(1, Math.max(0, -rect.top/span));
        const wrap = hero.querySelector(".constellation-wrap");
        if(wrap){
          wrap.style.transform = `translateY(${(progress*46).toFixed(1)}px) scale(${(1-progress*0.06).toFixed(3)})`;
          wrap.style.opacity = (1 - progress*0.55).toFixed(3);
        }
      }

      if(canHover){
        tiltX += (targetTiltX-tiltX)*0.08; tiltY += (targetTiltY-tiltY)*0.08;
        const tilt = document.getElementById("constellationTilt");
        if(tilt) tilt.style.transform = `translate(${tiltX.toFixed(2)}px, ${tiltY.toFixed(2)}px)`;
      }

      rafId = requestAnimationFrame(tick);
    }
    function start(){ if(rafId===null) rafId = requestAnimationFrame(tick); }
    function stop(){ if(rafId!==null){ cancelAnimationFrame(rafId); rafId=null; } }
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stop(); else start(); });
    start();
  }
}catch(e){ /* decorative depth effects failing should never block the app */ }

render();
</script>
</body>
</html>
